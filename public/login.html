<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OMEGA RHUB CT251</title>
  <!-- Favicon Oficial da Ômega -->
  <link rel="icon" type="image/png" href="/assets/img/logo_omega_redonda.png">
  <link rel="shortcut icon" href="/assets/img/logo_omega_redonda.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/logo_omega_redonda.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body.login-page {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(220, 38, 38, 0.12) 0%, transparent 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      height: 60px;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .login-title span {
      color: #f87171;
    }
    .login-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 1rem;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px 12px 40px;
      color: #ffffff;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
      background: #0f172a;
    }
    .form-control::placeholder {
      color: #475569;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      color: #64748b;
      cursor: pointer;
      font-size: 1rem;
      background: none;
      border: none;
      padding: 0;
    }
    .toggle-password:hover {
      color: #cbd5e1;
    }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      margin-top: 8px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #991b1b 0%, #b91c1c 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: none;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .login-alert--danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .login-alert--success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .login-footer-info {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }
    .demo-credentials {
      margin-top: 18px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed #334155;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }
    .demo-credentials code {
      color: #f87171;
      font-weight: 700;
      background: rgba(248, 113, 113, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="assets/logo.png" alt="Omega Service" class="login-logo">
        <h1 class="login-title">OMEGA <span>METRICS</span></h1>
        <p class="login-subtitle">Sistema Integrado de RH &amp; Operações CT251</p>
      </div>

      <div class="login-alert login-alert--danger" id="login-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span id="login-error-msg">Credenciais inválidas.</span>
      </div>

      <div class="login-alert login-alert--success" id="login-success">
        <i class="bi bi-check-circle-fill"></i>
        <span>Login autorizado! Redirecionando...</span>
      </div>

      <form id="form-login" autocomplete="off">
        <div class="form-group">
          <label for="matricula" class="form-label">Matrícula</label>
          <div class="input-wrapper">
            <i class="bi bi-person-badge input-icon"></i>
            <input type="text" id="matricula" name="matricula" class="form-control" placeholder="Digite sua matrícula" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="senha" class="form-label">Senha de Acesso</label>
          <div class="input-wrapper">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
            <button type="button" class="toggle-password" id="btn-toggle-senha" title="Mostrar/Ocultar Senha">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          <i class="bi bi-box-arrow-in-right"></i>
          <span>Acessar Sistema</span>
        </button>
      </form>

      <div class="demo-credentials" style="font-size: 0.75rem; color: #64748b; margin-top: 20px;">
        <i class="bi bi-shield-check" style="color: #38bdf8;"></i> Ambiente corporativo restrito a usuários autorizados.
      </div>
    </div>

    <div class="login-footer-info">
      &copy; 2026 OMEGA SERVICE · Todos os direitos reservados.
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Se já houver usuário autenticado no localStorage, redireciona para o Dashboard
      var loggedUser = localStorage.getItem('omega_user');
      if (loggedUser) {
        try {
          var parsed = JSON.parse(loggedUser);
          if (parsed && parsed.matricula) {
            window.location.replace('dashboard.html');
            return;
          }
        } catch (e) {}
      }

      var form = document.getElementById('form-login');
      var errBox = document.getElementById('login-error');
      var errMsg = document.getElementById('login-error-msg');
      var succBox = document.getElementById('login-success');
      var btnSubmit = document.getElementById('btn-submit');
      var toggleSenha = document.getElementById('btn-toggle-senha');
      var senhaInput = document.getElementById('senha');

      // Alternar visualização da senha
      if (toggleSenha && senhaInput) {
        toggleSenha.addEventListener('click', function () {
          var isPassword = senhaInput.type === 'password';
          senhaInput.type = isPassword ? 'text' : 'password';
          toggleSenha.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errBox.style.display = 'none';
        succBox.style.display = 'none';

        var matricula = (document.getElementById('matricula').value || '').trim();
        var senha = document.getElementById('senha').value;

        if (!matricula || !senha) {
          errMsg.textContent = 'Preencha a matrícula e a senha.';
          errBox.style.display = 'flex';
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Autenticando...';

        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matricula: matricula, senha: senha })
          });
          var data = await res.json();

          if (!res.ok || !data.success) {
            errMsg.textContent = data.error || 'Credenciais inválidas.';
            errBox.style.display = 'flex';
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> <span>Acessar Sistema</span>';
            return;
          }

          // Armazena credenciais e sessão no localStorage
          localStorage.setItem('omega_user', JSON.stringify(data.usuario));
          if (data.token) {
            localStorage.setItem('omega_auth_token', data.token);
          }

          succBox.style.display = 'flex';
          setTimeout(function () {
            window.location.replace('dashboard.html');
          }, 600);
        } catch (err) {
          console.error('Falha na requisição de login:', err);
          errMsg.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
          errBox.style.display = 'flex';
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> <span>Acessar Sistema</span>';
        }
      });
    });
  </script>
</body>
</html>
