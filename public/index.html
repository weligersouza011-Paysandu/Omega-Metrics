<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Omega Metrics</title>
  <!-- Favicon Oficial da Ômega -->
  <link rel="icon" type="image/png" href="/assets/img/logo_omega_redonda.png">
  <link rel="shortcut icon" href="/assets/img/logo_omega_redonda.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/logo_omega_redonda.png">
  <script src="js/auth.js"></script>
  <script>
    (function() {
      var user = window.OmegaAuth ? window.OmegaAuth.getUser() : null;
      if (!user || !user.matricula) {
        window.location.replace('login.html');
      } else {
        window.location.replace('dashboard.html');
      }
    })();
  </script>
</head>
